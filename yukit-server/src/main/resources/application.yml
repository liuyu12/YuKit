server:
  port: 8888

spring:
  profiles:
    # 本地开发默认 dev（彩色控制台 + SQL 日志），生产启动 --spring.profiles.active=prod
    active: dev
  datasource:
    # 库结构由 Flyway 自动初始化，新库开箱即用；默认库名 yukit，遗留 dev 库可用 MYSQL_DATABASE=ry-vue 覆盖回退
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yukit}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    # 默认值仅供本地开发；生产通过环境变量注入真实口令，禁止明文提交
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP（Boot 默认池，已随 spring-boot-starter-jdbc 传递引入）
    hikari:
      pool-name: YukitHikariPool
      # 最大连接数：宁小勿大，超过 DB 承载只会加剧锁等待，经验公式 核数×2+磁盘数
      maximum-pool-size: 20
      # 最小空闲：与 max 相等 = 固定池，避免流量突增时现建连接的延迟抖动
      minimum-idle: 20
      # 拿不到连接快速失败（默认 30s 太长，排队掩盖问题不如快速暴露）
      connection-timeout: 5000
      # 连接最大存活 15min，必须小于 MySQL wait_timeout（默认 8h），防死连接
      max-lifetime: 900000
      # 空闲连接回收时间，仅 min-idle < max 时有意义，固定池下几乎不触发
      idle-timeout: 600000
      # 借出超过 30s 未归还则打告警堆栈，排查连接泄漏利器（生产可关）
      leak-detection-threshold: 30000
      # 每个新连接建立后执行，会话时区双保险（与 URL 的 serverTimezone 叠加）
      connection-init-sql: SET time_zone = '+08:00'
  # Flyway：启动期自动执行各模块 jar 内 db/migration/**.sql，并按版本记录于 flyway_schema_history
  flyway:
    enabled: true
    # Flyway 11+ 原生支持跨 jar 扫描，不再接受 classpath*: 前缀（仅 classpath:/filesystem:）
    locations: db/migration
    # 禁用 flyway.clean，防误操作清库
    clean-disabled: true
    baseline-on-migrate: true
    # 对“非空但无历史记录”的存量库（如 ry-vue）基线到 V2，不重跑建表/种子脚本；新空库不受影响
    baseline-version: 2
    baseline-description: baseline existing schema
  # Redis 主连接：业务缓存(@Cacheable) + 验证码等；Sa-Token 会话另走 alone 独立库（见下方 sa-token.alone-redis）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 默认值仅供本地开发，生产同样改环境变量注入：REDIS_PASSWORD
      password: ${REDIS_PASSWORD:123456}
      # 业务库：与 Sa-Token 会话库(alone-redis.database)分开
      database: 0
      # 命令超时，比默认 2s 稍紧，快速失败
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          # 拿不到连接等待时长，设短避免雪崩式堆积
          max-wait: 3000

mybatis-plus:
  # 扫描各模块 jar 内的 XML 映射文件（classpath* 星号不可省略）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志交给 Logback（StdOutImpl 绕过日志框架，无法控制级别/颜色/开关）；
    # dev 下 Mapper 接口 DEBUG 级别即打印 SQL，见 logback-spring.xml
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

############## 接口文档 springdoc-openapi ##############
springdoc:
  api-docs:
    # 文档总开关；生产环境务必置 false（或整体移除依赖）关闭，避免暴露接口面
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

############## 可观测性 Actuator / Micrometer ##############
# 生产两种加固方式（择一）：
#  1) 独立管理端口：设 management.server.port，业务端口完全不暴露 actuator，无需安全白名单；
#  2) 同端口（当前默认）：仅暴露必要端点，/actuator/** 已在下方 yukit.security.exclude-paths 放行，
#     生产应改为网关/内网受限访问，或收紧 exposure include（保留 health 即可）。
management:
  endpoints:
    web:
      exposure:
        # 白名单式暴露：health 供存活/就绪探针，metrics+prometheus 供监控抓取；关闭 env/beans 等敏感端点
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 详情仅授权后可见，避免向未授权方泄露 DB/Redis 等依赖信息
      show-details: when_authorized
      probes:
        # 开启 k8s 存活/就绪探针：/actuator/health/liveness、/readiness
        enabled: true
  metrics:
    tags:
      # 为所有指标打应用标签，多服务共用 Prometheus 时区分来源
      application: yukit

############## Sa-Token 配置 ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒）默认 30 天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），超时未访问则冻结，-1 代表不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录（true 允许，false 新登录挤掉旧登录）
  is-concurrent: true
  # 多人登录同一账号时是否共用一个 token（true 共用，false 每次新建）
  is-share: false
  # token 风格
  token-style: uuid
  # Redis key 统一前缀，多项目共用 Redis 时隔离命名空间
  key-prefix: "yukit:satoken:"
  # 会话存储已从内存切换到 Redis（sa-token-redis-template 自动装配 SaTokenDao），
  # 重启不掉线、支持集群部署；未引入该插件时默认存进程内存
  # Alone 独立 Redis：会话数据连到独立库，与业务缓存分库（结构同 spring.data.redis，需注册 SaAloneRedisInject 生效）
  alone-redis:
    host: ${spring.data.redis.host}
    port: ${spring.data.redis.port}
    password: ${spring.data.redis.password}
    # 会话专用库；删掉本行即回退为会话与业务共用主库
    database: 1

############## 安全模块配置 ##############
yukit:
  # 接口访问日志：每请求输出一行摘要（traceId/方法/路径/状态/业务code/耗时/IP/用户/UA）
  access-log:
    # 总开关，false 则不装配访问日志过滤器
    enabled: true
    # 不记录噪音路径（Ant 风格），默认已含文档/健康检查端点，可按需追加
    exclude-paths:
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /actuator/**
      - /favicon.ico
    # 解析业务 code/msg 时最多窥探的响应体字节数（有界，避免大 body 全量缓冲）
    max-response-body-bytes: 8192
    # 窥探请求体的字节上限（仅 application/json 请求才包装）
    max-request-body-bytes: 8192
    # 全局打印请求/响应体（脱敏+截断），建议只在 dev 按需开启；生产保持 false
    log-request-body: false
    log-response-body: false
    # 是否允许请求头 X-Access-Log-Body: true 对单次请求强制打印 body；生产建议置 false 封死动态开启
    allow-debug-header: true
  security:
    # 免登录白名单（默认已含 /error 与静态资源，此处追加业务接口）
    exclude-paths:
      - /system/auth/login
      - /system/auth/captcha
      # 接口文档端点放行，否则 Swagger UI / OpenAPI JSON 会被登录校验拦成 401
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
      # Actuator 端点放行（同端口部署时）；若改用独立 management.server.port 可移除此条
      - /actuator/**
  captcha:
    # 登录图形验证码总开关，开发/内网调试可置 false 跳过校验
    enabled: false
    # 验证码有效期（秒），答案存 Redis 到期自动失效
    expire-seconds: 120
    # 图片尺寸与字符数
    width: 120
    height: 40
    code-count: 4
    line-count: 20
    # Redis key 前缀，多项目共用 Redis 时隔离命名空间
    redis-key-prefix: "yukit:captcha:"
  cache:
    # 本地缓存总开关，false 则不装配 CacheManager（@Cacheable 失效）
    enabled: true
    # 缓存后端：caffeine（本地，默认，单机/可容忍各节点独立）| redis（集中式，多实例共享、重启不丢）
    # 切 redis 复用应用主连接工厂(spring.data.redis，即业务库)，业务侧 @Cacheable 无需改动
    type: caffeine
    # ===== 以下 spec/caches 仅 type=caffeine 生效 =====
    # 默认规格：未单独声明的缓存名套用（最多 500 条、写入后 10 分钟过期）
    spec: maximumSize=500,expireAfterWrite=10m
    # 按缓存名差异化：key 与 @Cacheable(cacheNames=...) 对应
    caches:
      # 字典/配置类：变化少、TTL 长
      dict: maximumSize=200,expireAfterWrite=1h
      # 用户/权限类：适中
      user: maximumSize=1000,expireAfterWrite=5m
    # 是否记录命中率统计（排查期可开，生产建议关）
    record-stats: true
    # ===== 以下 redis 块仅 type=redis 生效 =====
    redis:
      # key 前缀，最终形如 yukit:cache:dict::sys_user_sex
      key-prefix: "yukit:cache:"
      # 默认存活时间，0 表示不过期
      time-to-live: 10m
      # 按缓存名覆盖 TTL（对应 @Cacheable 的 cacheNames）
      ttl-by-cache:
        dict: 1h
        user: 5m
